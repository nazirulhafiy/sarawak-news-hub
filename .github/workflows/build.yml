name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 08:00 in Sarawak (UTC+8). Refreshes story and scheme counts.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PRs: one group per PR so concurrent PR builds do not cancel each other.
  # main, schedule, and manual runs share "pages" and are not cancelled mid-deploy.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        # Discovers tests/test_build.py, including test_third_site_renders_card_and_map_tile.
        run: python -m unittest discover -s tests -v
      - name: Build static site
        run: python scripts/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
